info:
  name: create-payment
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/v1/payments"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: "{{$randomUUID}}"
  body:
    type: json
    data: |-
      {
          "sourceAccountId": "{{srcId}}",
          "destinationAccountId": "{{destId}}",
          "amountCents": 1500,
          "currency": "CAD",
          "description": "Test payment"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.id) {
          bru.setVar("paymentId", body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
