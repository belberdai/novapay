spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO

management:
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false

aws:
  region: us-east-1
  access-key-id: test
  secret-access-key: test
  sns:
    endpoint: http://localhost:4566   # LocalStack
    payment-events-topic-arn: arn:aws:sns:us-east-1:000000000000:payment-events

outbox:
  poller:
    fixed-delay-ms: 5000
    batch-size: 100