spring:
  application:
    name: analytics-service
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
  oltp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
aws:
  region: us-east-1
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    endpoint: http://localhost:4566
    queue-url: http://localhost:4566/000000000000/payment-analytics
  dynamodb:
    endpoint: http://localhost:4566
anomaly:
  velocity-threshold: 5