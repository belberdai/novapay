name: CI

on:
  push:
    branches: [feature/ci-pipeline-v2]
  pull_request:
    branches: [main]

jobs:
  payment-service:
    name: Build payment-service (Java/Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: ./services/payment-service
        run: ./mvnw --batch-mode verify

  analytics-service:
    name: Build analytics-service (Kotlin/Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: ./services/analytics-service
        run: ./gradlew build